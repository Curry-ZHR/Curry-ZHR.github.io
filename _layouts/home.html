<!doctype html>
<html lang="{{ site.locale | slice: 0, 2 }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#a8b9c9">
    <title>{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/harry-evening-lab.webp' | absolute_url }}">
    <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preload" as="image" href="{{ '/images/harry-evening-lab.webp' | relative_url }}" media="(min-width: 701px) and (min-aspect-ratio: 1/1)">
    <link rel="preload" as="image" href="{{ '/images/harry-evening-lab-mobile.webp' | relative_url }}" media="(max-width: 700px), (max-aspect-ratio: 1/1)">
    <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}?v=work-cards-1">
    <script defer src="{{ '/assets/js/home.js' | relative_url }}?v=work-cards-1"></script>
  </head>
  <body>
    <a class="skip-link" href="#about">Skip to about</a>
    <main id="main-content">
      {{ content }}
    </main>
  </body>
</html>
