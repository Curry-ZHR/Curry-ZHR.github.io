{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

{% if page.layout == "home" %}
<link rel="preload" as="image" type="image/webp" href="{{ '/images/hero-huarui-manga.webp' | relative_url }}" fetchpriority="high"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/home.css"/>
{% endif %}

<style>
  html {
    scroll-behavior: smooth;
  }

  #news,
  #publications,
  #awards,
  #educations,
  #internships {
    scroll-margin-top: 90px;
  }

  .home-list {
    margin-top: 0;
  }

  .home-list li {
    margin-bottom: 0.8rem;
  }

  .edu-tag {
    display: inline-block;
    margin-left: 0.5rem;
    padding: 0.05rem 0.45rem;
    border: 1px solid #555;
    background-color: rgb(178, 204, 238);
    border-radius: 999px;
    font-size: 0.78em;
    line-height: 1.5;
    font-weight: 600;
    color: #333;
    vertical-align: middle;
    white-space: nowrap;
  }

  .home-links a {
    margin-right: 0.8rem;
  }

  .hl-red {
    color: #d0021b;
    font-weight: 700;
  }
</style>

<!-- end custom head snippets -->
